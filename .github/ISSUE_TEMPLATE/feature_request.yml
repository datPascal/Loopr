name: Feature request
description: Propose a focused change to Loopr.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Loopr solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the user would see and what the app would do.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety
      description: Explain any health claims, network access, sensitive data, Bluetooth writes, or compatibility risks.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

